:root{
  --bg:#EDF1EE; --surface:#FFFFFF; --surface2:#F3F6F4; --ink:#15211C; --muted:#5A6A63; --line:#D5DDD8;
  --pine:#1B6B57; --pine-ink:#FFFFFF; --pine-soft:#DDEEE8;
  --hero:#0F4C3F; --hero-ink:#F2FBF7; --hero-mut:rgba(242,251,247,.74); --ring:#8EE3C5; --ring-track:rgba(255,255,255,.16);
  --water:#2F7FD6; --kcal:#D98E04; --carb:#7B62C9; --fat:#CF5F52; --warn:#C2410C; --ok:#1B6B57;
  --display:'Sora',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --body:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E1512; --surface:#17211C; --surface2:#1E2B25; --ink:#E8F0EC; --muted:#93A59C; --line:#2B3B33;
    --pine:#4CC2A0; --pine-ink:#06231B; --pine-soft:#1B3A31; --hero:#14392F; --ring:#6FE0BC;
    --water:#5AA2F0; --kcal:#F0B429; --carb:#A58DF0; --fat:#F08A7C; --warn:#FB923C; --ok:#4CC2A0;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1512; --surface:#17211C; --surface2:#1E2B25; --ink:#E8F0EC; --muted:#93A59C; --line:#2B3B33;
  --pine:#4CC2A0; --pine-ink:#06231B; --pine-soft:#1B3A31; --hero:#14392F; --ring:#6FE0BC;
  --water:#5AA2F0; --kcal:#F0B429; --carb:#A58DF0; --fat:#F08A7C; --warn:#FB923C; --ok:#4CC2A0;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--pine);outline-offset:2px}
#app{max-width:560px;margin:0 auto;padding-bottom:96px;min-height:100vh}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;padding:12px 16px 8px;border-bottom:1px solid var(--line)}
header.top h1{font-family:var(--display);font-size:20px;line-height:1.1;margin:0;font-weight:700;letter-spacing:-.01em}
header.top .sub{font-size:13px;color:var(--muted);margin-top:2px}
.hr{display:flex;align-items:center;gap:10px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.dot.saving{background:var(--kcal)} .dot.err{background:var(--warn)}
.savetxt{font-size:12px;color:var(--muted)}
.iconbtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.iconbtn svg,nav.tabs svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
main{padding:12px 16px 0;display:grid;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.card h2{font-family:var(--display);font-size:15px;margin:0 0 10px;font-weight:600}
.card h2 small{font-family:var(--body);font-weight:400;color:var(--muted);font-size:13px;margin-left:6px}
.muted{color:var(--muted)} .small{font-size:13px}
.big{font-family:var(--display);font-weight:700;letter-spacing:-.02em}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.btn{border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:9px 12px;font-weight:500;min-height:40px}
.btn.primary{background:var(--pine);border-color:var(--pine);color:var(--pine-ink)}
.btn.danger{color:var(--warn);border-color:var(--warn);background:transparent}
.btn.sm{padding:5px 10px;min-height:32px;font-size:14px}
.btn:disabled{opacity:.5}
input[type=number],input[type=text],input[type=date],select,textarea{width:100%;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:9px 10px;min-height:40px}
textarea{resize:vertical;min-height:70px}
label.f{display:grid;gap:4px;font-size:13px;color:var(--muted)}
label.f input,label.f select{color:var(--ink)}
.bar{height:10px;border-radius:6px;background:var(--surface2);border:1px solid var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--pine);border-radius:6px}
.bar.k>i{background:var(--kcal)} .bar.p>i{background:var(--pine)} .bar.c>i{background:var(--carb)} .bar.f>i{background:var(--fat)} .bar.w>i{background:var(--water)}
.bar.over>i{background:var(--warn)}
.macro{display:grid;grid-template-columns:62px 1fr 92px;align-items:center;gap:8px;font-size:14px;margin-top:8px}
.macro span:last-child{text-align:right;color:var(--muted);font-size:13px}
.datenav{display:grid;grid-template-columns:44px 1fr 44px;gap:8px;align-items:center}
.datenav input{text-align:center;font-weight:600}
.badge{display:inline-block;font-size:12px;padding:3px 8px;border-radius:99px;background:var(--pine-soft);color:var(--pine);font-weight:600}
dl.plan{display:grid;grid-template-columns:96px 1fr;gap:6px 10px;margin:8px 0 0;font-size:14px}
dl.plan dt{color:var(--muted)} dl.plan dd{margin:0}
.seg{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.seg button{border:1px solid var(--line);background:var(--surface2);border-radius:10px;min-height:40px;font-weight:600}
.seg button.on{background:var(--pine);color:var(--pine-ink);border-color:var(--pine)}
.check{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;font-size:15px}
.check:first-of-type{border-top:0}
.box{width:22px;height:22px;border-radius:7px;border:1.5px solid var(--muted);display:grid;place-items:center;flex:none}
.box svg{width:14px;height:14px;stroke:var(--pine-ink);stroke-width:3;fill:none;opacity:0}
.check.on .box{background:var(--pine);border-color:var(--pine)} .check.on .box svg{opacity:1}
.check.auto{cursor:default}
.check small{margin-left:auto;color:var(--muted);font-size:12px}
.water{display:grid;grid-template-columns:78px 1fr;gap:14px;align-items:center}
.water svg{width:78px;height:auto}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface2);border-radius:12px;padding:9px 10px;text-align:left;display:grid;gap:1px}
.chip b{font-weight:600;font-size:14px} .chip span{font-size:12px;color:var(--muted)}
.item{display:grid;grid-template-columns:1fr auto;gap:2px 8px;padding:10px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item .nm{font-weight:600} .item .mt{font-size:13px;color:var(--muted);grid-column:1}
.item .ct{grid-column:2;grid-row:1/3;display:flex;align-items:center;gap:6px}
.qty{min-width:34px;text-align:center;font-weight:600;font-size:14px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.stat .v{font-family:var(--display);font-size:24px;font-weight:700;letter-spacing:-.02em}
.stat .l{font-size:13px;color:var(--muted)}
.pos{color:var(--ok)} .neg{color:var(--warn)}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:13px;white-space:nowrap}
th,td{padding:7px 8px;text-align:right;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--surface)}
th{color:var(--muted);font-weight:500}
svg.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:10px;font-family:var(--body)}
.chart .grid{stroke:var(--line);stroke-width:1}
.tabs2{display:flex;gap:6px}
.tabs2 button{flex:1;border:1px solid var(--line);background:var(--surface2);border-radius:10px;min-height:36px;font-size:14px}
.tabs2 button.on{background:var(--pine);color:var(--pine-ink);border-color:var(--pine)}
.exercise{padding:12px 0;border-top:1px solid var(--line)}
.exercise:first-of-type{border-top:0}
.exercise .nm{font-weight:600}
.exercise .tip{font-size:13px;color:var(--muted);margin:2px 0 8px}
.exercise .hint{font-size:12px;color:var(--pine);margin-top:6px}
.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.gallery button{padding:0;border:0;background:none;position:relative;border-radius:10px;overflow:hidden;aspect-ratio:3/4}
.gallery img,.cmp img{width:100%;height:100%;object-fit:cover;display:block;border-radius:10px}
.gallery span{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(transparent,rgba(0,0,0,.7));color:#fff;font-size:11px;padding:14px 6px 4px;text-align:left}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cmp figure{margin:0}.cmp img{aspect-ratio:3/4}
.cmp figcaption{font-size:12px;color:var(--muted);margin-top:4px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs div{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs button{border:0;background:none;padding:8px 0 7px;display:grid;justify-items:center;gap:2px;font-size:11px;color:var(--muted);font-weight:500}
nav.tabs button.on{color:var(--pine)}
#sheet .back{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center}
#sheet .pane{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px));display:grid;gap:12px}
#sheet .pane img.full{width:100%;max-height:60vh;object-fit:contain;border-radius:12px;background:#000}

<script>
(function(){
'use strict';

/* ---------- helpers ---------- */
var $=function(s,r){return (r||document).querySelector(s);};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});};
var pad=function(n){return String(n).padStart(2,'0');};
var ymd=function(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());};
var parseD=function(s){var p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2]);};
var today=function(){return ymd(new Date());};
var addDays=function(s,n){var d=parseD(s);d.setDate(d.getDate()+n);return ymd(d);};
var diff=function(a,b){return Math.round((parseD(b)-parseD(a))/864e5);};
var mondayOf=function(s){var d=parseD(s);d.setDate(d.getDate()-((d.getDay()+6)%7));return ymd(d);};
var DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
var MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
var fmtDate=function(s,y){var d=parseD(s);return DOW[d.getDay()]+' '+d.getDate()+' '+MON[d.getMonth()]+(y?' '+d.getFullYear():'');};
var shortDate=function(s){var d=parseD(s);return d.getDate()+' '+MON[d.getMonth()];};
var num=function(v){if(v===''||v==null)return null;var n=parseFloat(v);return isFinite(n)?n:null;};
var r1=function(n){return Math.round(n*10)/10;};
var fmt1=function(n){return n==null?'-':String(r1(n));};
var sgn=function(n){return (n>0?'+':n<0?'\u2212':'')+Math.abs(r1(n));};

/* ---------- plan data (from the 3-month plan) ---------- */
var EXS={
  A:[
    {id:'squat',n:'Goblet squat or leg press',tip:'Sit back and down, knees follow toes.'},
    {id:'chest',n:'Chest press (machine or dumbbell)',tip:'Lower for 2-3 seconds, press up.'},
    {id:'pulldown',n:'Lat pulldown',tip:'Pull to upper chest, squeeze shoulder blades.'},
    {id:'shoulder',n:'Seated dumbbell shoulder press',tip:'Do not arch your back.'},
    {id:'curl',n:'Dumbbell biceps curl',tip:'No swinging.'},
    {id:'plank',n:'Plank (seconds in Reps)',tip:'3 x 20-40 seconds, body in one line.'}
  ],
  B:[
    {id:'rdl',n:'Romanian deadlift (light dumbbells)',tip:'Hips back, back flat. Glute bridge in month 1.'},
    {id:'pushup',n:'Incline push-up or incline dumbbell press',tip:'Hands on a bench for push-ups.'},
    {id:'row',n:'Seated cable row or one-arm dumbbell row',tip:'Elbows close, pause at the squeeze.'},
    {id:'lateral',n:'Lateral raise',tip:'Light weight, controlled.'},
    {id:'triceps',n:'Triceps pushdown or bench dips',tip:'Elbows fixed at your sides.'},
    {id:'deadbug',n:'Dead bug or bird-dog',tip:'Slow, 8-10 reps per side.'}
  ]
};
var MENU={
  1:['Soya chunk curry (40 g dry)','Moong dal'],
  2:['Paneer bhurji with capsicum (100 g)','Masoor dal'],
  3:['Soya keema with peas (40 g dry)','Toor dal'],
  4:['Paneer tikka, air-fried (100 g)','Rajma'],
  5:['Soya chunk pulao with lots of veg','Moong dal'],
  6:['Tofu or paneer stir-fry (100-150 g)','Chana masala'],
  0:['Your favourite home dish (flex day is optional)','Sprouts moong chaat']
};
var FOODS=[
  {n:'Whey protein',u:'1 scoop (30 g)',k:120,p:24,c:3,f:2},
  {n:'Soya chunks',u:'40 g dry',k:135,p:21,c:13,f:0.5},
  {n:'Low-fat paneer',u:'100 g',k:190,p:19,c:4,f:11},
  {n:'Tofu',u:'100 g',k:120,p:12,c:2,f:7},
  {n:'Dal, cooked',u:'1 katori',k:115,p:7,c:18,f:2},
  {n:'Rajma, cooked',u:'1 katori',k:140,p:9,c:22,f:1},
  {n:'Chana, cooked',u:'1 katori',k:160,p:9,c:24,f:3},
  {n:'Hung curd',u:'100 g',k:65,p:8,c:4,f:2},
  {n:'Buttermilk',u:'1 glass',k:40,p:2,c:4,f:1.5},
  {n:'Roti',u:'1 medium',k:100,p:3,c:18,f:2},
  {n:'Rice, cooked',u:'half cup',k:100,p:2,c:22,f:0.3},
  {n:'Moong chilla',u:'1 piece',k:90,p:6,c:12,f:2},
  {n:'Vegetables / salad',u:'100 g',k:35,p:2,c:6,f:0.3},
  {n:'Oil or ghee',u:'1 tsp',k:45,p:0,c:0,f:5},
  {n:'Fruit',u:'1 apple or guava',k:75,p:0.5,c:19,f:0.2},
  {n:'Banana',u:'1 medium',k:90,p:1,c:23,f:0.3},
  {n:'Almonds',u:'5 pieces',k:35,p:1.2,c:1.3,f:3},
  {n:'Peanuts',u:'10 g',k:57,p:2.6,c:1.6,f:5}
];
var TEMPLATE=[[0,2],[1,1],[2,1],[4,1.5],[7,2],[9,2],[10,1],[12,3.5],[13,2],[14,1],[16,1]];
var HABITS=[
  {k:'walk',t:'Morning walk done'},
  {k:'lift',t:'Workout done (or the planned walk)'},
  {k:'window',t:'Ate only in the 7:00-8:30 pm window'},
  {k:'supps',t:'Vitamins / creatine taken'}
];
var MEAS=[['waist','Waist at navel (cm)'],['chest','Chest (cm)'],['hips','Hips (cm)'],['thigh','Thigh, mid (cm)'],['arm','Upper arm (cm)'],['neck','Neck (cm)'],['sys','BP top number'],['dia','BP bottom number'],['pulse','Resting pulse']];
var DEFAULTS={startDate:null,startWeight:90,goalWeight:81,heightCm:163,kcal:1500,protein:130,carbs:130,fat:50,water:3500,theme:'auto',welcomed:false,windowStart:'19:00',windowEnd:'20:30',badges:null,lastBackup:null};

/* ---------- state ---------- */
var S={settings:Object.assign({},DEFAULTS),days:{},meas:{},train:{},photos:{}};
var ui={tab:'today',date:today(),sheet:null,ready:false,save:'ok',mode:'device',range:'12w',confirm:null,
  photoDate:today(),photoLabel:'Front',cmpLabel:'Front',cmpA:null,cmpB:null,measDate:today(),trainType:null};
var store=null,dlCap=null,sampleFn=null;
var BLANK=Object.freeze({foods:[],checks:{}});
var peek=function(d){return S.days[d]||BLANK;};
var edit=function(d){if(!S.days[d])S.days[d]={id:d,foods:[],checks:{}};if(!S.days[d].foods)S.days[d].foods=[];if(!S.days[d].checks)S.days[d].checks={};return S.days[d];};
var strip=function(o){var c={};Object.keys(o).forEach(function(k){if(k!=='id')c[k]=o[k];});return c;};

/* ---------- storage ---------- */
function localStore(){
  if(!window.indexedDB)return lsStore();
  var dbp=null;
  function open(){
    if(dbp)return dbp;
    dbp=new Promise(function(res,rej){
      var r=window.indexedDB.open('leanlog',1);
      r.onupgradeneeded=function(){r.result.createObjectStore('kv');};
      r.onsuccess=function(){res(r.result);};
      r.onerror=function(){rej(r.error);};
    });
    return dbp;
  }
  function fail(e){return {code:(e&&e.name==='QuotaExceededError')?'quota_exceeded':'idb',message:(e&&e.message)||'Storage error'};}
  function tx(mode,fn){
    return open().then(function(db){
      return new Promise(function(res,rej){
        var t=db.transaction('kv',mode),out;
        try{out=fn(t.objectStore('kv'));}catch(e){rej(fail(e));return;}
        t.oncomplete=function(){res(out);};
        t.onerror=function(){rej(fail(t.error));};
        t.onabort=function(){rej(fail(t.error));};
      });
    });
  }
  return {
    mode:'device',
    getSettings:function(){return tx('readonly',function(st){return st.get('settings');}).then(function(o){return o.result||null;});},
    setSettings:function(o){return tx('readwrite',function(st){return st.put(o,'settings');}).then(function(){});},
    all:function(c){
      var rg=window.IDBKeyRange.bound(c+':',c+':\uffff');
      return tx('readonly',function(st){return {v:st.getAll(rg),k:st.getAllKeys(rg)};}).then(function(o){
        return o.v.result.map(function(val,i){val.id=String(o.k.result[i]).slice(c.length+1);return val;});
      });
    },
    set:function(c,id,o){return tx('readwrite',function(st){return st.put(o,c+':'+id);}).then(function(){});},
    del:function(c,id){return tx('readwrite',function(st){return st['delete'](c+':'+id);}).then(function(){});}
  };
}
function lsStore(){
  var mem={};var ok=true;
  try{window.localStorage.setItem('leanlog:t','1');window.localStorage.removeItem('leanlog:t');}catch(e){ok=false;}
  var g=function(k){try{return ok?window.localStorage.getItem(k):mem[k];}catch(e){return mem[k];}};
  var s=function(k,v){try{if(ok)window.localStorage.setItem(k,v);else mem[k]=v;}catch(e){throw {code:'quota_exceeded',message:'This device has no more room. Delete some photos.'};}};
  var d=function(k){try{if(ok)window.localStorage.removeItem(k);else delete mem[k];}catch(e){}};
  var keys=function(){try{if(ok){var a=[];for(var i=0;i<window.localStorage.length;i++)a.push(window.localStorage.key(i));return a;}}catch(e){}return Object.keys(mem);};
  return {
    mode:ok?'device':'memory',
    getSettings:function(){return Promise.resolve(g('leanlog:settings')?JSON.parse(g('leanlog:settings')):null);},
    setSettings:function(o){s('leanlog:settings',JSON.stringify(o));return Promise.resolve();},
    all:function(c){var pre='leanlog:'+c+':';var out=[];keys().forEach(function(k){if(k.indexOf(pre)===0){try{var o=JSON.parse(g(k));o.id=k.slice(pre.length);out.push(o);}catch(e){}}});return Promise.resolve(out);},
    set:function(c,id,o){s('leanlog:'+c+':'+id,JSON.stringify(o));return Promise.resolve();},
    del:function(c,id){d('leanlog:'+c+':'+id);return Promise.resolve();}
  };
}
function dbStore(db,uid){
  var root=db.doc('data/users/'+uid+'/store');
  return {
    mode:'account',
    getSettings:function(){return root.get().then(function(s){return s.exists?s.data():null;});},
    setSettings:function(o){return root.set(o);},
    all:function(c){return root.collection(c).get().then(function(q){return q.docs.map(function(x){var o=Object.assign({},x.data());o.id=x.id;return o;});});},
    set:function(c,id,o){return root.collection(c).doc(id).set(o);},
    del:function(c,id){return root.collection(c).doc(id).delete();}
  };
}
var timers={},chains={},pending=0;
function setSave(st){ui.save=st;var d=$('#savedot'),t=$('#savetxt');if(d){d.className='dot '+(st==='ok'?'':st==='saving'?'saving':'err');}if(t){t.textContent=st==='ok'?'Saved':st==='saving'?'Saving':'Not saved';}}
function queue(coll,id,getObj,delay){
  var k=coll+'/'+id;clearTimeout(timers[k]);setSave('saving');pending++;
  timers[k]=setTimeout(function(){
    var obj=getObj();
    chains[k]=(chains[k]||Promise.resolve()).then(function(){
      return obj===null?store.del(coll,id):store.set(coll,id,obj);
    }).then(function(){pending--;if(pending<=0){pending=0;setSave('ok');}},function(e){pending--;setSave('err');toast(errMsg(e));});
  },delay==null?500:delay);
}
function errMsg(e){
  var c=e&&e.code;
  if(c==='quota_exceeded')return 'Storage is full. Delete old photos and try again.';
  if(c==='invalid_argument')return 'Could not save. Use Settings > Export to keep a copy.';
  return 'Could not save. Check your connection.';
}
function saveSettings(){setSave('saving');store.setSettings(S.settings).then(function(){setSave('ok');},function(e){setSave('err');toast(errMsg(e));});}
function persistDay(d){queue('days',d,function(){return S.days[d]?strip(S.days[d]):null;});afterChange(d);}
function persistTrain(d){queue('train',d,function(){return S.train[d]?strip(S.train[d]):null;});afterChange();}
function persistMeas(d){queue('meas',d,function(){return S.meas[d]?strip(S.meas[d]):null;},50);afterChange();}

/* ---------- derived data ---------- */
function totals(d){
  return (peek(d).foods||[]).reduce(function(a,x){var q=x.q==null?1:x.q;return {kcal:a.kcal+x.kcal*q,p:a.p+(x.p||0)*q,c:a.c+(x.c||0)*q,f:a.f+(x.f||0)*q};},{kcal:0,p:0,c:0,f:0});
}
function avgW(d,n){var s=0,c=0;for(var i=0;i<n;i++){var w=(S.days[addDays(d,-i)]||{}).weight;if(w!=null){s+=w;c++;}}return c?s/c:null;}
function weightDates(){return Object.keys(S.days).filter(function(k){return S.days[k].weight!=null;}).sort();}
function latestWeight(){var ds=weightDates();return ds.length?{d:ds[ds.length-1],w:S.days[ds[ds.length-1]].weight}:null;}
function dayNo(d){return S.settings.startDate?diff(S.settings.startDate,d)+1:1;}
function weekIdx(d){return Math.floor(diff(mondayOf(S.settings.startDate||today()),mondayOf(d))/7);}
function phaseOf(w){
  if(w<1)return {name:'Before your start date',rx:'The plan begins on your start date.'};
  if(w===1)return {name:'Month 1: learn the moves',rx:'2 sets x 10-12 reps, light weights, 3-4 reps left in the tank.'};
  if(w<=4)return {name:'Month 1: learn the moves',rx:'3 sets x 10-12 reps, 3 reps left in the tank.'};
  if(w<=8)return {name:'Month 2: build',rx:'3 sets x 8-12 reps, 2 reps left. Add weight when you hit 12 reps on every set.'};
  if(w<=11)return {name:'Month 3: push',rx:'Big lifts 4 x 6-10, other lifts 3 x 10-12, 1-2 reps left.'};
  if(w===12)return {name:'Test week',rx:'2 sets x 8-10, then test your rep maxes. Do final measurements, photos and blood tests.'};
  return {name:'Phase 2',rx:'Keep progressing. Consider a 4-day upper/lower split.'};
}
function stepsFor(w){return w<=2?7000:w<=4?8000:w<=6?9000:w<=8?10000:11000;}
function plan(d){
  var n=dayNo(d),wk=Math.floor((n-1)/7)+1,wi=weekIdx(d),dow=parseD(d).getDay();
  var lifts=[1,3,5],k=lifts.indexOf(dow),kind,type=null;
  if(k>=0){kind='lift';type=(wi%2===0)?(k%2===0?'A':'B'):(k%2===0?'B':'A');}
  else if(dow===0)kind='rest';else kind='walk';
  return {n:n,wk:wk,kind:kind,type:type,dow:dow,phase:phaseOf(n<1?0:wk),steps:stepsFor(n<1?1:wk),menu:MENU[dow]};
}
function streak(){
  var c=0,d=today();
  if(!hasData(d))d=addDays(d,-1);
  while(hasData(d)){c++;d=addDays(d,-1);}
  return c;
}
function hasData(d){var x=S.days[d];return !!x&&(x.weight!=null||(x.foods&&x.foods.length>0)||x.water>0||x.steps>0);}
function bodyFat(m){
  var h=S.settings.heightCm;
  if(!m||!m.waist||!m.neck||m.waist<=m.neck||!h)return null;
  var v=495/(1.0324-0.19077*Math.log10(m.waist-m.neck)+0.15456*Math.log10(h))-450;
  return isFinite(v)?v:null;

function habitState(d){
  var D=peek(d),st=S.settings,T=totals(d),ck=D.checks||{},wt=D.water||0,items=[];
  HABITS.forEach(function(h){items.push({k:h.k,t:h.t,on:!!ck[h.k],manual:true});});
  items.push({t:'Calories within target',on:T.kcal>0&&T.kcal<=st.kcal*1.03,s:T.kcal>0?Math.round(T.kcal)+' kcal':'log food'});
  items.push({t:'Protein target hit',on:T.p>=st.protein*0.95,s:Math.round(T.p)+' / '+st.protein+' g'});
  items.push({t:'Water target hit',on:wt>=st.water*0.95,s:(wt/1000).toFixed(1)+' / '+(st.water/1000).toFixed(1)+' L'});
  items.push({t:'Slept 7 hours or more',on:D.sleep!=null&&D.sleep>=7,s:D.sleep!=null?D.sleep+' h':'log sleep'});
  var done=items.filter(function(i){return i.on;}).length;
  return {items:items,done:done,total:items.length};
}
var QUOTES=['Small days add up to big changes.','You do not need a perfect day, just a done day.','Every rep is a vote for the person you are becoming.','Consistency beats intensity.','Fat loss is slow. Quitting is slower.','Show up tired. Log it anyway.','Water first, then food, then the next lift.','Progress shows in the mirror last.','The plan works if you keep working it.','One good week is the start of a good month.','Strong is the goal. Lighter is the side effect.','Trust the weekly average, not today\u2019s number.','Eat to the plan, train to the log.','Ten more minutes of walking is a win.'];
function quoteOfDay(){var n=new Date(),doy=Math.floor((n-new Date(n.getFullYear(),0,0))/864e5);return QUOTES[doy%QUOTES.length];}
function coachMsg(){
  var lw=latestWeight(),st=S.settings;
  if(!lw)return 'Log your first weigh-in to start your journey. Day 0 photos and measurements help too.';
  if(lw.w<=st.goalWeight)return 'You reached your goal weight. Hold it for 4 weeks, then choose your next phase.';
  var a=avgW(lw.d,7),b=avgW(addDays(lw.d,-7),7),c=avgW(addDays(lw.d,-14),7);
  if(a==null||b==null)return 'Keep weighing in. Your weekly trend appears after your second week of data.';
  var r=b-a;
  if(r>1.1)return 'You lost '+r1(r)+' kg this week, which is fast. If you feel weak, add 150 kcal and keep lifting to protect muscle.';
  if(r>=0.4)return 'Right on track: '+r1(r)+' kg down this week. Change nothing and repeat the week.';
  if(r>=0){return (c!=null&&c-b<0.4)?'Progress has slowed for 2 weeks. Add 2,000 steps a day first, then trim 100 kcal if it stays flat.':'A slow week is normal. Keep your routine and check the next weekly average.';}
  return 'Your average is up '+r1(-r)+' kg versus last week. Salt, creatine, hard training or poor sleep often cause this. Judge the next weekly average.';
}
function projectNote(){
  var st=S.settings,lw=latestWeight();if(!lw||!st.startDate)return '';
  var days=diff(st.startDate,lw.d),lost=st.startWeight-lw.w,left=lw.w-st.goalWeight;
  if(left<=0)return '<p class="note">You are at or below your goal weight.</p>';
  if(days<10||lost<=0.3)return '<p class="note">A goal-date estimate appears after about 10 days of weigh-ins.</p>';
  var wk=lost/days*7,date=addDays(lw.d,Math.round(left/wk*7));
  return '<p class="note"><b>At your pace of '+r1(wk)+' kg a week, you reach '+fmt1(st.goalWeight)+' kg around '+fmtDate(date,true)+'.</b></p>';
}
function hm(t){var p=(t||'19:00').split(':');return (+p[0])*60+(+p[1]||0);}
function fmtMin(m){var h=Math.floor(m/60),mm=m%60;return h?h+'h '+pad(mm)+'m':mm+'m';}
function fastInfo(){
  var n=new Date(),st=S.settings,a=hm(st.windowStart),b=hm(st.windowEnd),cur=n.getHours()*60+n.getMinutes();
  if(b<=a)b=a+90;
  if(cur>=a&&cur<b)return {open:true,pct:(cur-a)/(b-a)*100,txt:fmtMin(b-cur)+' left',tag:'Window open',sub:'Closes at '+st.windowEnd+'. Whey first, then the main meal.'};
  var toOpen=cur<a?a-cur:1440-cur+a,fasted=cur>=b?cur-b:1440-b+cur;
  return {open:false,pct:fasted/(fasted+toOpen)*100,txt:'Opens in '+fmtMin(toOpen),tag:'Fasting '+fmtMin(fasted),sub:'Black coffee, tea and water are free. Window opens at '+st.windowStart+'.'};
}

/* ---------- Train ---------- */
function vTrain(){
  var d=ui.date,P=plan(d),out='';
  var sess=S.train[d];
  var type=(sess&&sess.type)||ui.trainType||(P.type)||'A';
  out+='<div class="card">'+dateNav()+'</div>';
  out+='<div class="card"><div class="row between wrap"><h2 style="margin:0">'+(P.kind==='lift'?'Planned: Workout '+P.type:P.kind==='walk'?'Planned: walk day':'Planned: rest day')+'</h2><span class="badge">'+esc(P.phase.name)+'</span></div>'+
    '<p class="small muted" style="margin:8px 0 10px">'+esc(P.phase.rx)+' Rest 60-120 seconds between sets. Start with an 8-minute warm-up.</p>'+
    '<div class="tabs2"><button class="'+(type==='A'?'on':'')+'" data-act="trainType" data-v="A">Workout A</button><button class="'+(type==='B'?'on':'')+'" data-act="trainType" data-v="B">Workout B</button></div></div>';
  var ex=(sess&&sess.ex)||{};
  out+='<div class="card"><h2>Log sets<small>weight, sets, reps</small></h2>';
  EXS[type].forEach(function(e){
    var v=ex[e.id]||{};var last=lastFor(e.id,d);
    out+='<div class="exercise"><div class="nm">'+esc(e.n)+'</div><div class="tip">'+esc(e.tip)+'</div>'+exBox(e.id)+'<div class="grid3">'+
      '<label class="f">Weight (kg)<input type="number" inputmode="decimal" step="0.5" data-f="tr:'+e.id+':w" value="'+(v.w!=null?v.w:'')+'"></label>'+
      '<label class="f">Sets<input type="number" inputmode="numeric" data-f="tr:'+e.id+':s" value="'+(v.s!=null?v.s:'')+'"></label>'+
      '<label class="f">Reps<input type="number" inputmode="numeric" data-f="tr:'+e.id+':r" value="'+(v.r!=null?v.r:'')+'"></label></div>'+
      (last?'<div class="hint">Last time: '+esc(last)+'. Beat it by 1 rep or the next small weight jump.</div>':'')+'</div>';
  });
  out+='<label class="f" style="margin-top:8px">Session notes<textarea data-f="trnote" placeholder="Form cues, pain, how it felt">'+esc((sess&&sess.note)||'')+'</textarea></label></div>';
  // history
  var hist=Object.keys(S.train).sort().reverse().slice(0,8);
  out+='<div class="card"><h2>Recent sessions</h2>';
  if(!hist.length)out+='<p class="empty">Your logged workouts will show up here.</p>';
  hist.forEach(function(k){
    var s=S.train[k],vol=0,cnt=0;
    Object.keys(s.ex||{}).forEach(function(i){var e=s.ex[i];if(e&&(e.w!=null||e.r!=null)){cnt++;vol+=(e.w||0)*(e.s||1)*(e.r||0);}});
    out+='<div class="item"><div class="nm">'+esc(fmtDate(k))+' \u00b7 Workout '+esc(s.type||'')+'</div><div class="mt">'+cnt+' exercises logged \u00b7 volume '+Math.round(vol).toLocaleString()+' kg</div></div>';
  });
  return out+'</div>';
}
function lastFor(id,before){
  var ks=Object.keys(S.train).filter(function(k){return k<before;}).sort().reverse();
  for(var i=0;i<ks.length;i++){var e=(S.train[ks[i]].ex||{})[id];if(e&&(e.w!=null||e.r!=null)){return (e.w!=null?e.w+' kg':'bodyweight')+' \u00b7 '+(e.s||'?')+' x '+(e.r!=null?e.r:'?')+' on '+shortDate(ks[i]);}}
  return '';
}

function vProgress(){
  var st=S.settings,lw=latestWeight(),out='';
  var h=st.heightCm/100;
  var lost=lw?st.startWeight-lw.w:null,toGoal=lw?lw.w-st.goalWeight:null,bmi=lw?lw.w/(h*h):null;
  var rate=null;if(lw){var a=avgW(lw.d,7),b=avgW(addDays(lw.d,-7),7);if(a!=null&&b!=null)rate=a-b;}
  out+=weekCard();
  out+='<div class="stats"><div class="stat"><div class="v">'+(lw?fmt1(lw.w):'-')+'<span class="small muted"> kg</span></div><div class="l">Latest weight'+(lw?' ('+shortDate(lw.d)+')':'')+'</div></div>'+
    '<div class="stat"><div class="v '+(lost>0?'pos':'')+'">'+(lost!=null?sgn(-lost).replace('+','+'):'-')+'<span class="small muted"> kg</span></div><div class="l">Change since start ('+fmt1(st.startWeight)+' kg)</div></div>'+
    '<div class="stat"><div class="v">'+(toGoal!=null?(toGoal>0?fmt1(toGoal):'Goal!'):'-')+'<span class="small muted">'+(toGoal>0?' kg':'')+'</span></div><div class="l">To goal ('+fmt1(st.goalWeight)+' kg)</div></div>'+
    '<div class="stat"><div class="v">'+(bmi!=null?fmt1(bmi):'-')+'</div><div class="l">BMI'+(rate!=null?' \u00b7 week trend '+sgn(rate)+' kg':'')+'</div></div></div>';
  out+='<div class="card"><div class="row between"><h2 style="margin:0">Weight trend</h2></div><div class="tabs2" style="margin:10px 0">'+
    [['4w','4 weeks'],['12w','12 weeks'],['all','All']].map(function(r){return '<button class="'+(ui.range===r[0]?'on':'')+'" data-act="range" data-v="'+r[0]+'">'+r[1]+'</button>';}).join('')+'</div>'+weightChart()+

function niceTicks(lo,hi){
  var r=hi-lo,step=r<=4?0.5:r<=8?1:r<=16?2:5;
  var a=Math.floor(lo/step)*step,b=Math.ceil(hi/step)*step,t=[];
  for(var v=a;v<=b+1e-9;v+=step)t.push(v);
  return t;
}
function weightChart(){
  var st=S.settings,start=st.startDate||today();

  var last=ds[ds.length-1],x0,x1;
  if(ui.range==='4w'){x1=today()>last?today():last;x0=addDays(x1,-27);}
  else if(ui.range==='all'){x0=ds[0];x1=last;}
  else{x0=start<ds[0]?start:ds[0];x1=addDays(start,84);if(last>x1)x1=last;}
  if(diff(x0,x1)<7)x1=addDays(x0,7);
  var pts=ds.filter(function(k){return k>=x0&&k<=x1;}).map(function(k){return {k:k,w:S.days[k].weight,a:avgW(k,7)};});
  if(!pts.length)return '<p class="empty">No weigh-ins in this range.</p>';
  var plo=Math.max(x0,start),phi=addDays(start,84)<x1?addDays(start,84):x1,planOn=ui.range!=='4w'||true;
  var vals=pts.map(function(p){return p.w;});
  var pl=null;
  if(plo<=phi){pl=[{k:plo,w:expectedWeight(plo)},{k:phi,w:expectedWeight(phi)}];vals.push(pl[0].w,pl[1].w);}
  var ymin=Math.min.apply(null,vals)-0.5,ymax=Math.max.apply(null,vals)+0.5;

  var W=360,H=220,L=36,R=10,T=10,B=24,span=diff(x0,x1);

  ticks.forEach(function(v){s+='<line class="grid" x1="'+L+'" x2="'+(W-R)+'" y1="'+sy(v)+'" y2="'+sy(v)+'"/><text x="'+(L-5)+'" y="'+(sy(v)+3)+'" text-anchor="end">'+v+'</text>';});

  pts.forEach(function(p){s+='<circle cx="'+sx(p.k).toFixed(1)+'" cy="'+sy(p.w).toFixed(1)+'" r="2.6" fill="var(--muted)" opacity=".7"/>';});

function calChart(){

function compress(file){
  return new Promise(function(res,rej){
    var fr=new FileReader();
    fr.onerror=function(){rej({message:'Could not read that file.'});};
    fr.onload=function(){
      var im=new Image();
      im.onerror=function(){rej({message:'That file is not a photo this browser can open.'});};
      im.onload=function(){
        var max=860,w=im.naturalWidth,h=im.naturalHeight,sc=Math.min(1,max/Math.max(w,h));
        var c=document.createElement('canvas');c.width=Math.round(w*sc);c.height=Math.round(h*sc);
        c.getContext('2d').drawImage(im,0,0,c.width,c.height);
        var q=0.74,u=c.toDataURL('image/jpeg',q);
        while(u.length>190000&&q>0.4){q-=0.08;u=c.toDataURL('image/jpeg',q);}
        res(u);
      };
      im.src=fr.result;
    };
    fr.readAsDataURL(file);
  });
}
function addPhotos(files){
  var arr=Array.prototype.slice.call(files||[]);
  if(!arr.length)return;
  toast('Saving '+arr.length+' photo'+(arr.length>1?'s':'')+'...');

  arr.forEach(function(f){
    chain=chain.then(function(){return compress(f);}).then(function(u){
      var id='p'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
      var o={date:ui.photoDate,label:ui.photoLabel,note:'',img:u,t:Date.now()};
      return store.set('photos',id,o).then(function(){o.id=id;S.photos[id]=o;okc++;});
    }).catch(function(e){toast(e&&e.message&&e.code!=='quota_exceeded'&&!e.code?e.message:errMsg(e));});
  });
  chain.then(function(){if(okc)toast(okc+' photo'+(okc>1?'s':'')+' saved');afterChange();render();});
}

function weekReport(end){
  var st=S.settings,r={logged:0,kc:[],kcOk:0,prot:0,water:0,lifts:0,steps:[],sleep:[],hab:0,habTot:0},i,d,D,t,h;
  for(i=0;i<7;i++){
    d=addDays(end,-i);D=peek(d);t=totals(d);h=habitState(d);
    if(hasData(d))r.logged++;
    if(t.kcal>0){r.kc.push(t.kcal);if(t.kcal<=st.kcal*1.03)r.kcOk++;}
    if(t.p>=st.protein*0.95)r.prot++;
    if((D.water||0)>=st.water*0.95)r.water++;
    if(isWorkout(d))r.lifts++;
    if(D.steps!=null)r.steps.push(D.steps);
    if(D.sleep!=null)r.sleep.push(D.sleep);
    if(hasData(d)){r.hab+=h.done;r.habTot+=h.total;}
  }
  r.w=avgW(end,7);r.wPrev=avgW(addDays(end,-7),7);
  return r;
}

function askRules(){
  var st=S.settings;
  return 'You are a friendly, practical fitness coach inside a personal weight loss tracker. The user is a 41-year-old man, '+st.heightCm+' cm, strictly vegetarian (no eggs). His 12-week plan: '+st.kcal+' kcal/day, one meal a day (OMAD) between '+st.windowStart+' and '+st.windowEnd+', '+st.protein+' g protein, lifting Mon/Wed/Fri (alternating full-body Workout A and B), walking 7,000 rising to 11,000 steps, '+(st.water/1000)+' L water, start weight '+st.startWeight+' kg, goal '+st.goalWeight+' kg. '+
  'Plan rules: expected loss is 0.5-0.9 kg a week. If loss is under 0.4 kg a week for 2-3 weeks, add 2,000 steps first, then cut 100 kcal. If loss is over 1 kg a week for 3 weeks and he feels weak, add 150-200 kcal. Never advise below 1,400 kcal without a doctor. Daily weight swings of 0.5-1.5 kg are normal, so judge weekly averages. '+
  'If he mentions chest pain, fainting, persistent dizziness, palpitations, severe weakness or very dark urine, tell him to stop and see a doctor. You are not a doctor: no diagnosis and no medication advice. Suggest only Indian vegetarian foods (soya chunks, paneer, tofu, dal, rajma, chana, hung curd, whey, roti, rice, vegetables). '+
  'Answer in under 180 words, in plain text with short paragraphs or short dash lists. No tables, no markdown headings, no bold. Be warm and specific and use his numbers. If data is missing, say what to log.';
}
function askContext(){
  var st=S.settings,t=today(),P=plan(t),lw=latestWeight(),T=totals(t),rows=[],i,d,D,tt;
  for(i=13;i>=0;i--){
    d=addDays(t,-i);D=peek(d);tt=totals(d);
    if(hasData(d)||isWorkout(d))rows.push(d+': weight '+(D.weight!=null?D.weight+' kg':'-')+', '+Math.round(tt.kcal)+' kcal, protein '+Math.round(tt.p)+' g, water '+((D.water||0)/1000).toFixed(1)+' L, steps '+(D.steps!=null?D.steps:'-')+', sleep '+(D.sleep!=null?D.sleep+' h':'-')+', energy '+(D.energy||'-')+'/5, hunger '+(D.hunger||'-')+'/5, lift '+(isWorkout(d)?'yes':'no')+(D.notes?', note: '+String(D.notes).slice(0,100):''));
  }
  var foods=(peek(t).foods||[]).map(function(x){return x.name+' x'+(x.q==null?1:x.q);}).join(', ');
  var ks=Object.keys(S.meas).sort(),m=ks.length?S.meas[ks[ks.length-1]]:null;
  var l=[];
  l.push('Today is '+t+' ('+DOW[P.dow]+'), day '+P.n+' of the plan, week '+P.wk+', phase: '+P.phase.name+'. Planned today: '+(P.kind==='lift'?'Workout '+P.type:P.kind==='walk'?'walk day':'rest day')+'.');
  l.push('Latest weight: '+(lw?lw.w+' kg on '+lw.d:'none logged')+'. Start weight '+st.startWeight+' kg. 7-day average '+fmt1(avgW(t,7))+' kg, previous 7-day average '+fmt1(avgW(addDays(t,-7),7))+' kg.');
  l.push('Today so far: '+Math.round(T.kcal)+' of '+st.kcal+' kcal, protein '+Math.round(T.p)+' of '+st.protein+' g, water '+((peek(t).water||0)/1000).toFixed(1)+' L. Foods logged today: '+(foods||'none')+'.');
  if(m)l.push('Latest measurements ('+ks[ks.length-1]+'): '+Object.keys(m).filter(function(k){return k!=='id';}).map(function(k){return k+' '+m[k];}).join(', ')+'.');
  l.push('Last 14 days:\n'+(rows.length?rows.join('\n'):'no data logged yet'));
  return l.join('\n');
}
function newAsk(){return {turns:[],busy:false,live:'',err:'',draft:'',ctl:null};}
function askErr(e){
  var c=e&&e.code;
  if(c==='not_granted')return 'Claude was not allowed for this page. Allow it from the artifact\u2019s permissions menu to use this feature.';
  if(c==='rate_limited')return 'Too many requests. Wait a minute and try again.';
  if(c==='prompt_too_large')return 'Your log is too long to send. Try again later.';
  return 'Could not reach Claude. Check your connection and try again.';
}
function askSend(text){
  var A=ui.ask;text=(text||'').trim();
  if(!A||A.busy||!text||!sampleFn)return;
  A.turns.push({role:'user',content:text});A.busy=true;A.err='';A.live='';A.draft='';A.ctl=new AbortController();
  var input=A.turns.map(function(t,i){return i===0?{role:'user',content:askRules()+'\n\nMY DATA:\n'+askContext()+'\n\nMY QUESTION: '+t.content}:{role:t.role,content:t.content};});
  renderSheet();
  var fin=function(){A.busy=false;A.live='';A.ctl=null;if(ui.sheet&&ui.sheet.type==='ask')renderSheet();};
  var p;
  try{
    p=sampleFn(input,{cache:false,modelTier:'quick',signal:A.ctl.signal,onText:function(o){A.live=o.text;var el=$('#askLive');if(el)el.textContent=o.text;}});
  }catch(e){p=Promise.reject(e);}
  p.then(function(r){A.turns.push({role:'assistant',content:r.text});fin();},function(e){
    if(e&&e.text){A.turns.push({role:'assistant',content:e.text});}
    else{A.turns.pop();A.draft=text;}
    if(!e||e.code!=='cancelled')A.err=askErr(e);
    fin();
  });
}
function askSheet(){
  var A=ui.ask||(ui.ask=newAsk()),h='';
  h+='<div class="row between"><b style="font-family:var(--display);font-size:18px">Ask Claude</b><div class="row" style="gap:6px">'+(A.turns.length?'<button class="btn sm" data-act="askNew"'+(A.busy?' disabled':'')+'>New chat</button>':'')+'<button class="btn sm" data-act="closeSheet">Close</button></div></div>';
  h+='<p class="small muted" style="margin:0">Answers use your logged data and your plan. This is general coaching, not medical advice.</p>';
  if(!A.turns.length&&!A.busy)h+='<div class="qchips">'+ASK_CHIPS.map(function(q,i){return '<button data-act="askChip" data-i="'+i+'">'+esc(q)+'</button>';}).join('')+'</div>';
  h+='<div class="chat">'+A.turns.map(function(t){return '<div class="bub '+(t.role==='user'?'u':'a')+'">'+esc(t.content)+'</div>';}).join('');
  if(A.busy)h+='<div class="bub a" id="askLive">'+esc(A.live||'Thinking...')+'</div>';
  h+='</div>';
  if(A.err)h+='<p class="small neg" style="margin:0">'+esc(A.err)+'</p>';
  h+='<div class="askrow"><textarea id="askBox" data-f="askBox" rows="2" placeholder="Ask about food, workouts, plateaus..." style="min-height:48px">'+esc(A.draft||'')+'</textarea>'+
    (A.busy?'<button class="btn danger" data-act="askStop">Stop</button>':'<button class="btn primary" data-act="askSend">Send</button>')+'</div>';
  return h;
}

/* ---------- toast ---------- */
var toastT=null;
function toast(m){var t=$('#toast');if(!t)return;t.textContent=m;t.className='show';clearTimeout(toastT);toastT=setTimeout(function(){t.className='';},2600);}
function confirmed(key){
  if(ui.confirm===key){ui.confirm=null;return true;}
  ui.confirm=key;render();
  setTimeout(function(){if(ui.confirm===key){ui.confirm=null;render();}},4000);
  return false;
}

/* ---------- export / import ---------- */
function csvCell(v){v=v==null?'':String(v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}
function buildCsv(){
  var rows=[['date','weight_kg','kcal','protein_g','carbs_g','fat_g','water_ml','steps','sleep_h','energy_1_5','hunger_1_5','workout','walk_min','notes']];
  Object.keys(S.days).sort().forEach(function(k){var D=S.days[k],t=totals(k);rows.push([k,D.weight,Math.round(t.kcal)||'',Math.round(t.p)||'',Math.round(t.c)||'',Math.round(t.f)||'',D.water,D.steps,D.sleep,D.energy,D.hunger,isWorkout(k)?'yes':'',D.walkMin,D.notes]);});
  return rows.map(function(r){return r.map(csvCell).join(',');}).join('\n');
}
function browserSave(name,data){
  return new Promise(function(res,rej){
    try{
      var b=new Blob([data],{type:/\.csv$/.test(name)?'text/csv':'application/json'});
      var u=URL.createObjectURL(b),a=document.createElement('a');
      a.href=u;a.download=name;document.body.appendChild(a);a.click();
      setTimeout(function(){URL.revokeObjectURL(u);if(a.parentNode)a.parentNode.removeChild(a);},1500);
      res();
    }catch(e){rej(e);}
  });
}
function saveFile(name,data,isBackup){
  var go=dlCap?dlCap.save({filename:name,data:data}):browserSave(name,data);
  go.then(function(){toast('File saved');if(isBackup){S.settings.lastBackup=today();saveSettings();}},function(e){
    if(e&&e.code==='declined')return;
    if(data.length>400000){toast('This file is too large to save from here. Use the backup without photos.');return;}
    ui.sheet={type:'text',title:name,text:data};renderSheet();
  });
}
function exportJson(withPhotos){
  var o={app:'lean-log',version:1,exported:new Date().toISOString(),settings:S.settings,days:{},meas:{},train:{}};
  if(withPhotos){o.photos={};Object.keys(S.photos).forEach(function(k){o.photos[k]=strip(S.photos[k]);});}
  Object.keys(S.days).forEach(function(k){o.days[k]=strip(S.days[k]);});
  Object.keys(S.meas).forEach(function(k){o.meas[k]=strip(S.meas[k]);});
  Object.keys(S.train).forEach(function(k){o.train[k]=strip(S.train[k]);});
  saveFile('lean-log-backup-'+today()+(withPhotos?'-with-photos':'')+'.json',withPhotos?JSON.stringify(o):JSON.stringify(o,null,1),true);
}
function importJson(text){
  var o;try{o=JSON.parse(text);}catch(e){toast('That file is not a valid backup.');return;}
  if(!o||o.app!=='lean-log'){toast('That file is not a Lean Log backup.');return;}
  if(o.settings)Object.assign(S.settings,o.settings);saveSettings();
  var n=0;
  ['days','meas','train'].forEach(function(c){Object.keys(o[c]||{}).forEach(function(k){var v=o[c][k];if(v&&typeof v==='object'){v.id=k;S[c][k]=v;n++;queue(c,k,(function(cc,kk){return function(){return S[cc][kk]?strip(S[cc][kk]):null;};})(c,k),100);}});});
  var np=0;
  Object.keys(o.photos||{}).forEach(function(k){var v=o.photos[k];if(v&&v.img&&!S.photos[k]){v.id=k;S.photos[k]=v;np++;store.set('photos',k,strip(v)).then(null,function(er){toast(errMsg(er));});}});
  toast('Restored '+n+' days'+(np?' and '+np+' photos':'')+' of data');ui.sheet=null;render();
}
function wipe(){
  var jobs=[];
  ['days','meas','train','photos'].forEach(function(c){Object.keys(S[c]).forEach(function(k){jobs.push(store.del(c,k));});S[c]={};});
  S.settings=Object.assign({},DEFAULTS,{startDate:today(),welcomed:true});
  Promise.all(jobs).then(function(){return store.setSettings(S.settings);}).then(function(){toast('All data erased');},function(e){toast(errMsg(e));});
  ui.sheet=null;applyTheme();render();
}

/* ---------- events ---------- */
function applyTheme(){var t=S.settings.theme;if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);else document.documentElement.removeAttribute('data-theme');}
function readNum(id){var e=document.getElementById(id);return e?num(e.value):null;}
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-act]');if(!t)return;
  var a=t.getAttribute('data-act'),v=t.getAttribute('data-v'),d=ui.date;
  if(a==='backdrop'){if(e.target===t){ui.sheet=null;ui.confirm=null;renderSheet();}return;}
  if(a!=='clearFoods'&&a!=='delMeas'&&a!=='delPhoto'&&a!=='resetAll')ui.confirm=null;
  switch(a){
    case 'tab':ui.tab=v;window.scrollTo(0,0);render();break;
    case 'settings':ui.sheet={type:'settings'};renderSheet();break;
    case 'closeSheet':ui.sheet=null;ui.confirm=null;renderSheet();render();break;
    case 'welcome':S.settings.welcomed=true;saveSettings();render();break;
    case 'day':ui.date=addDays(ui.date,Number(v));render();break;
    case 'goToday':ui.date=today();render();break;
    case 'install':if(deferredInstall){deferredInstall.prompt();deferredInstall.userChoice.then(function(){deferredInstall=null;if(ui.sheet)renderSheet();});}break;
    case 'askOpen':if(!ui.ask)ui.ask=newAsk();ui.sheet={type:'ask'};renderSheet();break;
    case 'askReview':ui.ask=newAsk();ui.sheet={type:'ask'};askSend(REVIEW_Q);break;
    case 'askChip':{var q=ASK_CHIPS[Number(t.getAttribute('data-i'))];askSend(q==='Review my week'?REVIEW_Q:q);break;}
    case 'askSend':{var bx=$('#askBox');askSend(bx?bx.value:'');break;}
    case 'askStop':if(ui.ask&&ui.ask.ctl)ui.ask.ctl.abort();break;
    case 'askNew':ui.ask=newAsk();renderSheet();break;
    case 'exInfo':ui.sheet={type:'ex',id:t.getAttribute('data-id')};renderSheet();break;
    case 'pick':ui.date=v;render();break;
    case 'water':{var D=edit(d);D.water=Math.max(0,(D.water||0)+Number(v));persistDay(d);render();break;}
    case 'waterCustom':{var n=readNum('waterCustom');if(n){var D2=edit(d);D2.water=Math.max(0,(D2.water||0)+n);persistDay(d);render();}break;}
    case 'rate':{var D3=edit(d),k=t.getAttribute('data-k'),nv=Number(v);D3[k]=D3[k]===nv?null:nv;persistDay(d);render();break;}
    case 'habit':{var D4=edit(d);D4.checks[v]=!D4.checks[v];persistDay(d);render();break;}
    case 'addFood':{addFoodItem(d,FOODS[Number(t.getAttribute('data-i'))],1);persistDay(d);render();toast('Added '+FOODS[Number(t.getAttribute('data-i'))].n);break;}
    case 'qty':{var D5=edit(d),id=t.getAttribute('data-id');D5.foods.forEach(function(x){if(x.id===id){x.q=Math.max(0.5,(x.q==null?1:x.q)+Number(v));}});persistDay(d);render();break;}
    case 'delFood':{var D6=edit(d),id2=t.getAttribute('data-id');D6.foods=D6.foods.filter(function(x){return x.id!==id2;});persistDay(d);render();break;}
    case 'clearFoods':if(confirmed('clearFoods')){edit(d).foods=[];persistDay(d);render();}break;
    case 'template':{TEMPLATE.forEach(function(p){addFoodItem(d,FOODS[p[0]],p[1]);});persistDay(d);render();toast('Plan day added');break;}
    case 'copyYesterday':{var y=peek(addDays(d,-1)).foods||[];if(!y.length){toast('Nothing logged yesterday');break;}var D7=edit(d);y.forEach(function(x){var c=Object.assign({},x);c.id=newId();D7.foods.push(c);});persistDay(d);render();toast('Copied '+y.length+' items');break;}
    case 'addCustom':{
      var nm=($('#cf-name')||{}).value||'',k2=readNum('cf-k');
      if(!nm.trim()||k2==null){toast('Enter a name and calories');break;}
      edit(d).foods.push({id:newId(),name:nm.trim(),unit:'custom',kcal:k2,p:readNum('cf-p')||0,c:readNum('cf-c')||0,f:readNum('cf-f')||0,q:1});
      persistDay(d);render();toast('Added');break;}
    case 'trainType':{ui.trainType=v;var s=S.train[d];if(s){s.type=v;persistTrain(d);}render();break;}
    case 'range':ui.range=v;render();break;
    case 'saveMeas':{
      var m={};MEAS.forEach(function(f){var x=readNum('m-'+f[0]);if(x!=null)m[f[0]]=x;});
      if(!Object.keys(m).length){toast('Enter at least one measurement');break;}
      m.id=ui.measDate;S.meas[ui.measDate]=m;persistMeas(ui.measDate);render();toast('Measurements saved');break;}
    case 'delMeas':if(confirmed('delMeas')){delete S.meas[ui.measDate];persistMeas(ui.measDate);render();}break;
    case 'pickMeas':ui.measDate=v;render();window.scrollTo(0,document.body.scrollHeight);break;
    case 'pickPhoto':{var fi=$('#photoInput');if(fi)fi.click();break;}
    case 'cmpLabel':ui.cmpLabel=v;ui.cmpA=null;ui.cmpB=null;render();break;
    case 'openPhoto':ui.sheet={type:'photo',id:t.getAttribute('data-id')};renderSheet();break;
    case 'delPhoto':if(confirmed('delPhoto')){var pid=t.getAttribute('data-id');delete S.photos[pid];store.del('photos',pid).then(null,function(er){toast(errMsg(er));});ui.sheet=null;render();toast('Photo deleted');}else renderSheet();break;
    case 'exportCsv':saveFile('lean-log-'+today()+'.csv',buildCsv());break;
    case 'exportJson':exportJson(false);break;
    case 'exportFull':exportJson(true);break;
    case 'importPick':{var ii=$('#importInput');if(ii)ii.click();break;}
    case 'resetAll':if(confirmed('resetAll'))wipe();else renderSheet();break;
  }
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.id==='photoInput'){addPhotos(t.files);t.value='';return;}
  if(t.id==='importInput'){var f=t.files&&t.files[0];if(f){var fr=new FileReader();fr.onload=function(){importJson(String(fr.result));};fr.readAsText(f);}t.value='';return;}
  var f2=t.getAttribute&&t.getAttribute('data-f');if(!f2)return;
  var d=ui.date,v=t.value;
  if(f2==='date'){if(v)ui.date=v;render();return;}
  if(f2==='measDate'){if(v)ui.measDate=v;render();return;}
  if(f2==='photoDate'){if(v)ui.photoDate=v;return;}
  if(f2==='photoLabel'){ui.photoLabel=v;ui.cmpLabel=v;return;}
  if(f2==='cmpA'){ui.cmpA=v;render();return;}
  if(f2==='cmpB'){ui.cmpB=v;render();return;}
  if(f2==='photoNote'){var p=S.photos[(ui.sheet||{}).id];if(p){p.note=v;var o=strip(p);store.set('photos',p.id,o).then(null,function(er){toast(errMsg(er));});}return;}
  if(f2.indexOf('set:')===0){
    var k=f2.slice(4);
    if(k==='startDate'||k==='theme'||k==='windowStart'||k==='windowEnd'){if(k!=='theme'&&!v)return;S.settings[k]=v;}
    else{var n=num(v);if(n==null||n<=0)return;S.settings[k]=n;}
    S.settings.welcomed=true;saveSettings();applyTheme();render();return;
  }
  if(f2.indexOf('tr:')===0){
    var parts=f2.split(':'),ex=parts[1],fld=parts[2];
    var s=S.train[d]||(S.train[d]={id:d,type:ui.trainType||plan(d).type||'A',ex:{}});
    if(!s.ex)s.ex={};
    var e2=s.ex[ex]||(s.ex[ex]={});
    var n2=num(v);if(n2==null)delete e2[fld];else e2[fld]=n2;
    persistTrain(d);
    if(n2!=null&&(fld==='w'||fld==='r')){var D=edit(d);if(!D.checks.lift){D.checks.lift=true;persistDay(d);}}
    render();return;
  }
  var D2=edit(d),n3=num(v);
  if(f2==='weight'){D2.weight=(n3!=null&&n3>=20&&n3<=300)?n3:null;if(n3!=null&&D2.weight==null)toast('Enter a weight between 20 and 300 kg');}
  else if(f2==='steps'||f2==='walkMin'||f2==='sleep'){D2[f2]=n3!=null&&n3>=0?n3:null;}
  persistDay(d);render();
});
document.addEventListener('input',function(e){
  var t=e.target,f=t.getAttribute&&t.getAttribute('data-f');
  if(f==='note'){var D=edit(ui.date);D.notes=t.value;persistDay(ui.date);}
  else if(f==='askBox'){if(ui.ask)ui.ask.draft=t.value;}
  else if(f==='trnote'){var d=ui.date;var s=S.train[d]||(S.train[d]={id:d,type:ui.trainType||plan(d).type||'A',ex:{}});s.note=t.value;persistTrain(d);}
});

/* ---------- install ---------- */
var deferredInstall=null;
function isStandalone(){return (window.matchMedia&&window.matchMedia('(display-mode: standalone)').matches)||window.navigator.standalone===true;}
function installCard(){
  if(isStandalone())return '';
  return '<div class="card"><h2>Install on your phone</h2><p class="small muted" style="margin:0 0 10px">Add this app to your home screen to open it like an app, full screen and offline.</p>'+(deferredInstall?'<button class="btn primary" data-act="install">Install app</button>':'<p class="small" style="margin:0">In Chrome, tap the menu (three dots), then Install app or Add to Home screen.</p>')+'</div>';
}
window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();deferredInstall=e;if(ui.sheet&&ui.sheet.type==='settings')renderSheet();});
window.addEventListener('appinstalled',function(){deferredInstall=null;toast('App installed');if(ui.sheet&&ui.sheet.type==='settings')renderSheet();});
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').then(null,function(){});});}

/* ---------- boot ---------- */
function withTimeout(p,ms){return Promise.race([p,new Promise(function(r){setTimeout(function(){r(null);},ms);})]);}
async function loadAll(){
  var st=await store.getSettings();
  var first=!st;
  if(st)Object.assign(S.settings,st);
  if(!S.settings.startDate){S.settings.startDate=today();}
  var cs=['days','meas','train','photos'];
  var res=await Promise.all(cs.map(function(c){return store.all(c);}));
  cs.forEach(function(c,i){res[i].forEach(function(o){S[c][o.id]=o;});});
  return first;
}
async function boot(){
  render();
  var db=null,user=null,uid=null;
  try{
    if(window.claude&&typeof window.claude.use==='function'){
      var caps=await withTimeout(Promise.all([window.claude.use('db'),window.claude.use('user'),window.claude.use('downloads'),window.claude.use('sample')]),6000);
      if(caps){db=caps[0];user=caps[1];dlCap=caps[2];sampleFn=caps[3];}
      if(user&&typeof user.id==='function')uid=await user.id();
    }
  }catch(e){db=null;}
  var first=false;
  try{
    if(db&&uid){
      store=dbStore(db,uid);
      first=await loadAll();
      if(first){await store.setSettings(S.settings);}
    }else throw new Error('no db');
  }catch(e){
    store=localStore();
    S.days={};S.meas={};S.train={};S.photos={};S.settings=Object.assign({},DEFAULTS);
    try{first=await loadAll();}catch(e2){first=true;}
    if(first){try{await store.setSettings(S.settings);}catch(e3){}}
    if(db&&uid)toast('Could not reach your account. Saving on this device only.');
  }
  applyTheme();
  ui.ready=true;render();
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}
  checkBadges(true);
  setInterval(updateFast,30000);
}
boot();
})();
